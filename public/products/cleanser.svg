  <text x="300" y="298" font-family="Georgia,serif" font-size="10" fill="#781430" text-anchor="middle" letter-spacing="4" opacity="0.75">LUEUR SKIN</text>
  <text x="300" y="314" font-family="Georgia,serif" font-size="8" fill="#781430" text-anchor="middle" opacity="0.5" letter-spacing="2">by Alliyah</text>
  <line x1="248" y1="326" x2="352" y2="326" stroke="#781430" stroke-width="0.5" opacity="0.35"/>
  <text x="300" y="356" font-family="Georgia,serif" font-size="15" fill="#781430" text-anchor="middle" letter-spacing="1">Silk Radiance</text>
