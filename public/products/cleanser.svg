  <rect x="298" y="118" width="6" height="68" rx="3" fill="#781430" opacity="0.7"/>
  <!-- bottle body -->
  <path d="M210 195 Q210 182 220 178 L380 178 Q390 182 390 195" fill="url(#bottle1)" stroke="#d8aac8" stroke-width="1.2"/>
  <rect x="210" y="195" width="180" height="360" rx="22" fill="url(#bottle1)" stroke="#d8aac8" stroke-width="1.2"/>
  <rect x="210" y="545" width="180" height="20" rx="10" fill="#d8aac8" opacity="0.5"/>
