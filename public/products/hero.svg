<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0610"/>
      <stop offset="40%" stop-color="#5c1528"/>
      <stop offset="75%" stop-color="#781430"/>
      <stop offset="100%" stop-color="#a03050"/>
    </linearGradient>
    <radialGradient id="glow1" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f4cbe7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f4cbe7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#e89cd8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e89cd8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#heroGrad)"/>
  <rect width="1400" height="900" fill="url(#glow1)"/>
  <rect width="1400" height="900" fill="url(#glow2)"/>
  <!-- subtle grid texture -->
  <line x1="0" y1="450" x2="1400" y2="450" stroke="white" stroke-width="0.3" opacity="0.06"/>
  <line x1="700" y1="0" x2="700" y2="900" stroke="white" stroke-width="0.3" opacity="0.06"/>
  <!-- large decorative circle -->
  <circle cx="1000" cy="450" r="340" fill="none" stroke="white" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1000" cy="450" r="280" fill="none" stroke="white" stroke-width="0.3" opacity="0.06"/>
  <circle cx="1000" cy="450" r="200" fill="white" opacity="0.04"/>
  <!-- brand monogram / decorative element right side -->
  <text x="1000" y="380" font-family="Georgia,serif" font-size="72" fill="white" text-anchor="middle" opacity="0.07" letter-spacing="8">LUEUR</text>
  <text x="1000" y="460" font-family="Georgia,serif" font-size="72" fill="white" text-anchor="middle" opacity="0.07" letter-spacing="8">SKIN</text>
  <!-- corner marks -->
  <line x1="60" y1="60" x2="120" y2="60" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="60" x2="60" y2="120" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="1340" y1="60" x2="1280" y2="60" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="1340" y1="60" x2="1340" y2="120" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="840" x2="120" y2="840" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="840" x2="60" y2="780" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="1340" y1="840" x2="1280" y2="840" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="1340" y1="840" x2="1340" y2="780" stroke="white" stroke-width="1" opacity="0.25"/>
  <!-- horizontal rule decoration -->
  <line x1="100" y1="450" x2="480" y2="450" stroke="white" stroke-width="0.5" opacity="0.15"/>
</svg>
