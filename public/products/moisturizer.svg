  <!-- footer -->
  <text x="300" y="680" font-family="Arial,sans-serif" font-size="8" fill="#781430" text-anchor="middle" letter-spacing="4" opacity="0.35">BOTANICAL · CLINICAL · CRUELTY FREE</text>
