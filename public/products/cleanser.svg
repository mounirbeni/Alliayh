  <line x1="248" y1="393" x2="352" y2="393" stroke="#781430" stroke-width="0.5" opacity="0.35"/>
  <text x="300" y="415" font-family="Arial,sans-serif" font-size="9" fill="#781430" text-anchor="middle" letter-spacing="3" opacity="0.55">150 ML</text>
  <text x="300" y="433" font-family="Arial,sans-serif" font-size="8" fill="#781430" text-anchor="middle" opacity="0.4">CLEANSERS</text>
